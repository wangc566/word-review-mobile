<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>单词复习</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#1f2937}
body{display:flex;align-items:center;justify-content:center}
.box{text-align:center;padding:28px;max-width:420px}
.spinner{width:42px;height:42px;border:4px solid #dbe3ef;border-top-color:#6b84aa;border-radius:50%;animation:r .9s linear infinite;margin:0 auto 18px}
@keyframes r{to{transform:rotate(360deg)}}
.msg{font-size:16px;line-height:1.6}.hint{font-size:13px;color:#667085;margin-top:10px}
button{border:0;border-radius:12px;padding:12px 18px;background:#6b84aa;color:white;font-size:15px;margin-top:18px;display:none}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div class="msg" id="msg">正在连接单词复习服务器…</div>
  <div class="hint" id="hint">服务器每次启动后地址可能变化，系统会自动找到最新地址。</div>
  <button id="retry" onclick="start()">重新连接</button>
</div>
<script>
const CONFIG_URL = './current.json?_=' + Date.now();
let timer;
async function start(){
  clearTimeout(timer);
  document.querySelector('.spinner').style.display='block';
  document.getElementById('retry').style.display='none';
  document.getElementById('msg').textContent='正在连接单词复习服务器…';
  try{
    const r=await fetch(CONFIG_URL,{cache:'no-store'});
    if(!r.ok) throw new Error('current.json HTTP '+r.status);
    const data=await r.json();
    if(!data.url) throw new Error('没有服务器地址');
    const u=new URL(data.url);
    if(u.protocol!=='https:') throw new Error('服务器地址不是 HTTPS');
    location.replace(u.href);
    return;
  }catch(e){
    document.querySelector('.spinner').style.display='none';
    document.getElementById('msg').textContent='暂时无法连接电脑服务器';
    document.getElementById('hint').textContent='请确认电脑上的“启动单词复习服务器.bat”已经运行，并保持电脑联网。';
    document.getElementById('retry').style.display='inline-block';
    timer=setTimeout(start,15000);
  }
}
start();
</script>
</body>
</html>
